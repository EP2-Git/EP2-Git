name: Update GitHub activity card

on:
  schedule:
    - cron: "23 6 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-github-activity
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out the profile repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main

      - name: Generate the activity card
        run: node scripts/generate-github-activity.mjs

      - name: Commit an updated total
        run: |
          git add assets/github-activity-light.svg assets/github-activity-dark.svg

          if git diff --cached --quiet; then
            echo "Activity card is already current."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore: update GitHub activity card"
          git push
