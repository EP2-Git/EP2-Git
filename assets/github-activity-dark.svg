<svg xmlns="http://www.w3.org/2000/svg" width="520" height="110" viewBox="0 0 520 110" role="img" aria-labelledby="title description">
  <title id="title">333 GitHub contributions in the last year</title>
  <desc id="description">Rolling-year contribution total from GitHub's public profile, refreshed daily.</desc>
  <rect x="0.5" y="0.5" width="519" height="109" rx="12" fill="#0d1117" stroke="#30363d"/>
  <rect x="0" y="18" width="3" height="74" rx="1.5" fill="#b9adff"/>
  <g font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif">
    <text x="20" y="27" fill="#b9adff" font-size="11" font-weight="700" letter-spacing="1.3">GITHUB ACTIVITY</text>
    <text x="120" y="83" fill="#f0f6fc" font-size="48" font-weight="700" text-anchor="end">333</text>
    <text x="138" y="61" fill="#f0f6fc" font-size="18" font-weight="600">contributions</text>
    <text x="138" y="82" fill="#8b949e" font-size="12">rolling year · updated daily</text>
